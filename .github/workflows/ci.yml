name: CI


on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]


permissions:
  contents: read


env:
  DENO_DIR: deno_dependency_cache
  DENO_LOCKFILE: ${{ github.workspace }}/deno.lock


jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Setup Repo
        uses: actions/checkout@v3

      - name: Setup FFMPEG
        uses: FedericoCarboni/setup-ffmpeg@v3
        id: setup-ffmpeg
        with:
          ffmpeg-version: 7.0.1

      - name: Setup Deno
        uses: denoland/setup-deno@v2

      - name: Cache Deno dependencies 
        uses: actions/cache@v4
        with:
          path: ${{ env.DENO_DIR }}
          key: ${{ hashFiles(env.DENO_LOCKFILE) }}

      # SSH into github machine for quick iterative debugging (note that this sort of sucks if you want to retrieve a file via ssh)
      # - name: Setup tmate session
      #   uses: mxschmitt/action-tmate@v3

      - name: Test
        run: deno task test

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          path: "./test/artifacts/dot notation template/project_output/preview.jpg"
